# In-house physical products, printed and shipped by our production partner (the family print shop).
# The agents only design products listed here, in the colours and sizes listed here.
# TODO(owner): confirm blanks, colours, sizes, costs, prices and turnaround with the shop.
#   unit_cost  = what we pay the shop per item (blank + ink + labour)   -> owed to the shop per order
#   ship_cost  = typical postage + packaging (used for margin estimates only; Etsy shipping profile charges the buyer)
#   price      = default Etsy price; size_upcharge adds to it for bigger sizes
production_partner:
  name: Family print shop            # TODO(owner): the shop's name as set up in Etsy > Production partners
  location: Phoenix, Arizona          # TODO(owner)
  processing_days: [2, 5]             # made-to-order turnaround promised to buyers
  min_dpi: 300

items:
  tshirt:
    product_type: apparel
    label: Unisex T-shirt
    blank: Unisex soft cotton tee (Bella+Canvas 3001 or equivalent)
    method: DTF transfer

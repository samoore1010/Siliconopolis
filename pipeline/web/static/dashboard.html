<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siliconopolis</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="nav" aria-label="Main">
      <div class="brand"><span class="logo"></span><span>Siliconopolis</span></div>
      <nav>
        <a href="#home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span><b class="count" id="n-home"></b></a>
        <a href="#products" data-route="products"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Products</span></a>
        <a href="#research" data-route="research"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>Research</span><b class="count" id="n-research"></b></a>
        <a href="#orders" data-route="orders"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12a1 1 0 0 1-1 .9h-11a1 1 0 0 1-1-.9zM9 7a3 3 0 0 1 6 0"/></svg><span>Orders</span><b class="count" id="n-orders"></b></a>
        <a href="#spend" data-route="spend"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 8.5c0-1.9 2.2-3 5-3s5 1.1 5 3-2.2 2.5-5 3-5 1.3-5 3.5 2.2 3 5 3 5-1.1 5-3"/></svg><span>Spend</span></a>
        <a href="#team" data-route="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.2A6.5 6.5 0 0 1 21.5 20"/></svg><span>Team</span></a>
      </nav>
      <div class="nav-foot"><div id="env" style="display:contents"></div><a href="/status">System status</a></div>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Details">
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="detail"></div>
  </aside>
  <div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div class="lightbox" id="lightbox" hidden><img alt=""></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/static/dashboard.js"></script>
</body>
</html>

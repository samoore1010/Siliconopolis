[project]
name = "etsy-agent-pipeline"
version = "0.1.0"
description = "Near-autonomous multi-agent pipeline that researches, creates, QA-checks and drafts Etsy listings."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "pillow>=10.3",
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "imagehash>=4.3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "UP017"]

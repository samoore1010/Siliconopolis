name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODE: mock
      APP_ENV: local
      LLM_PROVIDER: mock
      DATABASE_URL: sqlite:///./ci.db
      STORAGE_BACKEND: local
      STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check pipeline tests scripts
      - run: alembic upgrade head
      - run: python -m pipeline smoke
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t etsy-agent-pipeline .
      - run: docker run --rm -e MODE=mock -e APP_ENV=local -e LLM_PROVIDER=mock etsy-agent-pipeline python -m pipeline --help
